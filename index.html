<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no">
  <title>意向月历 · 客户可查</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-app: #f4f7fc;
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: #e2edf2;
      --text-main: #1f3a4b;
      --text-soft: #4b6f86;
      --text-light: #7f9aae;
      --accent-wechat: #2c7da0;
      --accent-intent: #2f9e68;
      --accent-wechat-bg: #eef3fc;
      --accent-intent-bg: #edfaf3;
      --btn-bg: #ffffffcc;
      --btn-hover: #eef2f5;
      --shadow-card: 0 6px 14px rgba(0, 0, 0, 0.02), 0 2px 4px rgba(0, 0, 0, 0.03);
      --cal-hover: #e9f0f5;
      --cal-today: #e3edf5;
      --border-light: #e2eef5;
      --tooltip-bg: #1e2f3c;
      --tooltip-text: #f0f6fa;
      --modal-bg: rgba(30, 35, 48, 0.75);
      --modal-card: #ffffff;
      --pin-bg: rgba(255,255,255,0.9);
      
      --radius-ios: 24px;
      --radius-sm: 18px;
      --radius-xs: 14px;
      
      --wechat-gradient: linear-gradient(135deg, #a8e6cf 0%, #56c596 50%, #2d9a6c 100%);
      --intent-gradient: linear-gradient(135deg, #ffd194 0%, #ff9a3c 50%, #ff6d00 100%);
      --today-gradient: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff8a65 100%);
      --stats-gradient: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #4dd0e1 100%);
    }

    body.dark-mode {
      --bg-app: #11161f;
      --card-bg: #1e2938e6;
      --card-border: #2d3a4a;
      --text-main: #eef3fc;
      --text-soft: #afc4dc;
      --text-light: #829ab0;
      --accent-wechat: #8fb9d4;
      --accent-intent: #9aceb0;
      --accent-wechat-bg: #1f2a36;
      --accent-intent-bg: #1e2e28;
      --btn-bg: #28323fcc;
      --btn-hover: #2f3c4b;
      --cal-hover: #26303e;
      --cal-today: #1e3142;
      --border-light: #2a3848;
      --tooltip-bg: #eef3fc;
      --tooltip-text: #11161f;
      --modal-bg: rgba(0, 0, 0, 0.7);
      --modal-card: #1e2938;
      --pin-bg: rgba(30,40,55,0.9);
      
      --wechat-gradient: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #40916c 100%);
      --intent-gradient: linear-gradient(135deg, #4a2500 0%, #7c3a00 50%, #b85c00 100%);
      --today-gradient: linear-gradient(135deg, #3e1a0a 0%, #6b2f14 50%, #a0421e 100%);
      --stats-gradient: linear-gradient(135deg, #0d3b4a 0%, #1a5c6e 50%, #2a7d8f 100%);
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-app);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
      font-weight: 600;
      transition: background 0.2s;
    }

    .sync-status {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10000;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: var(--radius-xs);
      background: var(--card-bg);
      color: var(--text-soft);
      border: 1px solid var(--card-border);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .sync-status.show {
      opacity: 1;
    }
    .sync-status.success {
      color: var(--accent-intent);
    }
    .sync-status.error {
      color: #c97a7a;
    }

    .privacy-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--pin-bg);
      backdrop-filter: blur(20px);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      color: var(--text-main);
      font-weight: 600;
    }
    body.page-hidden .privacy-mask {
      display: flex;
    }
    body.page-hidden .app-shell {
      display: none;
    }
    .pin-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: var(--card-bg);
      padding: 48px 56px;
      border-radius: var(--radius-ios);
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      border: 1px solid var(--card-border);
      min-width: 340px;
    }
    .pin-stats {
      display: flex;
      gap: 24px;
      margin-bottom: 8px;
    }
    .pin-stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 20px 28px;
      background: var(--btn-bg);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      min-width: 120px;
    }
    .pin-stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-soft);
      letter-spacing: 0.5px;
    }
    .pin-stat-value {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
    }
    .pin-wechat-value {
      background: var(--wechat-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .pin-intent-value {
      background: var(--intent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .pin-input {
      width: 180px;
      padding: 16px 20px;
      border-radius: var(--radius-xs);
      border: 1.5px solid var(--card-border);
      background: var(--btn-bg);
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 6px;
      color: var(--text-main);
      outline: none;
      font-weight: 700;
      transition: border-color 0.2s;
    }
    .pin-input:focus {
      border-color: var(--accent-wechat);
    }
    .pin-btn {
      background: var(--accent-wechat);
      border: none;
      color: white;
      padding: 14px 40px;
      border-radius: var(--radius-xs);
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
    .pin-btn:hover {
      opacity: 0.9;
    }
    .pin-error {
      color: #c97a7a;
      font-size: 0.8rem;
      min-height: 20px;
      font-weight: 600;
    }

    .app-shell {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 18px 12px;
      overflow-y: auto;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }
    .title-section {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    h3 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }
    .date-chip {
      background: var(--card-bg);
      padding: 4px 12px;
      border-radius: var(--radius-xs);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-soft);
      border: 1px solid var(--card-border);
    }
    .action-group {
      display: flex;
      gap: 8px;
    }
    .icon-simple {
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-soft);
      transition: 0.15s;
      user-select: none;
      font-weight: 600;
    }

    .two-columns {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .left-area {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .right-area {
      flex: 2.2;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(2px);
      border-radius: var(--radius-ios);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
      padding: 18px 20px;
    }

    .card-divider {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 18px 0;
    }

    .counter-row {
      display: flex;
      gap: 14px;
    }
    .counter-card {
      flex: 1;
      border-radius: var(--radius-sm);
      padding: 12px;
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }
    .counter-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.15;
      z-index: 0;
      border-radius: var(--radius-sm);
    }
    .wechat-fill {
      background: var(--wechat-gradient);
      color: white;
    }
    .wechat-fill::before {
      background: var(--wechat-gradient);
    }
    .intent-fill {
      background: var(--intent-gradient);
      color: white;
    }
    .intent-fill::before {
      background: var(--intent-gradient);
    }
    .counter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .counter-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .reset-mini {
      background: rgba(255,255,255,0.3);
      border: none;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-xs);
      font-weight: 600;
      position: relative;
      z-index: 1;
    }
    .counter-value {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
      color: white;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
      position: relative;
      z-index: 1;
    }
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }
    .circle-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-xs);
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(255,255,255,0.5);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      font-weight: 700;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }
    .circle-btn:hover {
      background: rgba(255,255,255,0.5);
    }
    .btn-special {
      background: rgba(255,255,255,0.45);
      color: white;
      border-color: rgba(255,255,255,0.6);
    }

    @media (min-width: 761px) {
      .counter-card {
        padding: 20px 18px;
        border-radius: var(--radius-sm);
      }
      .counter-label {
        font-size: 1rem;
      }
      .counter-value {
        font-size: 4rem;
        font-weight: 900;
      }
      .circle-btn {
        width: 48px;
        height: 48px;
        font-size: 1.8rem;
      }
      .button-group {
        gap: 16px;
        margin-top: 18px;
      }
      .reset-mini {
        font-size: 0.8rem;
      }
    }

    .stats-row {
      display: flex;
      gap: 10px;
    }
    .stat-block {
      flex: 1;
      text-align: center;
      border-radius: var(--radius-sm);
      padding: 10px 4px;
      border: 1px solid var(--card-border);
      background: var(--stats-gradient);
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-block .label {
      font-size: 0.7rem;
      font-weight: 600;
      opacity: 0.9;
    }
    .stat-block .number {
      font-size: 1.35rem;
      font-weight: 800;
      margin-left: 4px;
    }

    .calendar-compact {
      padding: 10px 12px;
    }
    .cal-head {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-soft);
      margin-bottom: 8px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-light);
      padding: 4px 0;
    }
    .cal-day {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .cal-day:hover {
      background: var(--cal-hover);
      transform: scale(0.98);
    }
    .cal-day.today {
      background: var(--today-gradient);
      color: white;
      box-shadow: 0 0 20px rgba(255, 138, 101, 0.5);
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .day-number {
      font-size: 0.75rem;
      font-weight: 700;
    }
    .day-badge {
      display: flex;
      gap: 3px;
      font-size: 0.5rem;
      margin-top: 2px;
      color: var(--text-soft);
      font-weight: 600;
    }
    .cal-day.today .day-badge {
      color: rgba(255,255,255,0.9);
    }
    .day-badge span {
      background: rgba(100, 110, 130, 0.15);
      padding: 0px 3px;
      border-radius: var(--radius-xs);
    }
    .cal-day.today .day-badge span {
      background: rgba(255,255,255,0.3);
    }

    .tooltip-simple {
      position: fixed;
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 6px 14px;
      border-radius: var(--radius-xs);
      font-size: 0.7rem;
      pointer-events: none;
      z-index: 1100;
      opacity: 0;
      transition: 0.1s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-weight: 600;
    }
    .tooltip-simple.show { opacity: 1; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-bg);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
    .modal-card {
      background: var(--modal-card);
      border-radius: var(--radius-ios);
      width: 380px;
      max-width: 90vw;
      max-height: 70vh;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--text-main);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 8px;
    }
    .modal-header button {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-soft);
      font-weight: 700;
    }
    .client-modal-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 50vh;
    }
    .modal-client-item {
      background: var(--btn-bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      border: 1px solid var(--card-border);
    }
    .modal-client-name {
      font-weight: 800;
    }
    .modal-client-phone {
      font-size: 0.75rem;
      color: var(--text-soft);
      margin-left: 8px;
      font-weight: 600;
    }
    .modal-client-time {
      font-size: 0.65rem;
      color: var(--text-light);
      margin-left: 8px;
      font-weight: 500;
    }
    .modal-client-note {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-top: 4px;
      font-style: italic;
      font-weight: 600;
    }
    .empty-clients {
      text-align: center;
      color: var(--text-light);
      padding: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .register-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .input-simple {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xs);
      padding: 10px 16px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      min-width: 0;
      font-weight: 600;
    }
    .input-simple:focus {
      border-color: var(--accent-wechat);
    }
    .btn-add {
      background: var(--accent-intent);
      color: white;
      border: none;
      border-radius: var(--radius-xs);
      padding: 10px 22px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .client-scroll {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .client-row {
      background: var(--btn-bg);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      border: 1px solid var(--card-border);
      font-weight: 600;
    }
    .client-info {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: baseline;
    }
    .client-name {
      font-weight: 700;
    }
    .client-phone {
      color: var(--text-soft);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .client-note {
      color: var(--text-light);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .client-time {
      color: var(--text-light);
      font-size: 0.65rem;
      font-weight: 500;
    }
    .del-icon {
      background: none;
      border: none;
      font-size: 0.9rem;
      color: #c97a7a;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-xs);
      font-weight: 700;
    }
    .memo-area {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", monospace;
      font-size: 0.75rem;
      color: var(--text-main);
      resize: vertical;
      line-height: 1.5;
      font-weight: 600;
    }

    .todo-section {
      margin-top: 0;
    }
    .todo-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      max-height: 200px;
      overflow-y: auto;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--btn-bg);
      border-radius: var(--radius-xs);
      border: 1px solid var(--card-border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .todo-number {
      font-weight: 800;
      color: var(--accent-wechat);
      min-width: 20px;
      font-size: 0.85rem;
    }
    .todo-text {
      flex: 1;
      word-break: break-word;
      line-height: 1.4;
    }
    .todo-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .todo-input {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xs);
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--text-main);
      outline: none;
      font-weight: 600;
    }
    .todo-input:focus {
      border-color: var(--accent-wechat);
    }
    .todo-add-btn {
      background: var(--accent-wechat);
      color: white;
      border: none;
      border-radius: var(--radius-xs);
      padding: 8px 18px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .todo-del-btn {
      background: none;
      border: none;
      color: #c97a7a;

<div class="privacy-mask" id="privacyMask">
  <div class="pin-box">
    <div class="pin-stats" id="pinStatsContainer">
      <div class="pin-stat-item">
        <span class="pin-stat-label">今日微信</span>
        <span class="pin-stat-value pin-wechat-value" id="pinWechatNum">0</span>
      </div>
      <div class="pin-stat-item">
        <span class="pin-stat-label">今日意向</span>
        <span class="pin-stat-value pin-intent-value" id="pinIntentNum">0</span>
      </div>
    </div>
    <input type="password" class="pin-input" id="pinInput" placeholder="PIN" maxlength="6" inputmode="numeric">
    <button class="pin-btn" id="pinUnlockBtn">解锁</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

  <div class="container">

      <div class="title-section">

        <div class="date-chip" id="liveDate"></div>
      </div>
      <div class="action-group">
        <button class="icon-simple" id="syncNowBtn" title="手动同步">☁️</button>
        <button class="icon-simple" id="hideBtn" title="一键隐藏 (Ctrl+Z)">👁</button>
        <button class="icon-simple" id="darkToggleBtn">🌙</button>
      </div>
    </div>

    <div class="two-columns">
      <div class="left-area">
        <div class="counter-row">
          <div class="counter-card wechat-fill">
            <div class="counter-header"><span class="counter-label">今日微信</span><button class="reset-mini" id="resetWechatToday">↺</button></div>
            <div class="counter-value" id="wechatNum">0</div>
            <div class="button-group"><button class="circle-btn" id="wechatMinus">−</button><button class="circle-btn btn-special" id="wechatPlus">+</button></div>
          </div>
          <div class="counter-card intent-fill">
            <div class="counter-header"><span class="counter-label">今日意向</span><button class="reset-mini" id="resetIntentToday">↺</button></div>
            <div class="counter-value" id="intentNum">0</div>
            <div class="button-group"><button class="circle-btn" id="intentMinus">−</button><button class="circle-btn" id="intentPlus">+</button></div>

        <div class="stats-row">
          <div class="stat-block"><span class="label">本周微信</span> <span class="number" id="weekWechat">0</span></div>
          <div class="stat-block"><span class="label">本月微信</span> <span class="number" id="monthWechat">0</span></div>
          <div class="stat-block"><span class="label">本周意向</span> <span class="number" id="weekIntent">0</span></div>
          <div class="stat-block"><span class="label">本月意向</span> <span class="number" id="monthIntent">0</span></div>

        <div class="card calendar-compact">
          <div class="cal-head" id="calMonthTitle"></div>

      <div class="right-area">

          <div style="font-weight:700; margin-bottom:14px; font-size:0.9rem;">📋 意向登记</div>

            <div class="form-line">
              <input type="text" class="input-simple" id="custName" placeholder="姓名" autocomplete="off">
              <input type="text" class="input-simple" id="custPhone" placeholder="电话" autocomplete="off">
            </div>
            <input type="text" class="input-simple" id="custNote" placeholder="沟通记录 (必填)" autocomplete="off">
            <button class="btn-add" id="addClientBtn">+ 添加</button>
            <div class="client-scroll" id="clientList"></div>
          </div>
        </div>
        
        <div class="card">
          <div class="todo-section">
            <div class="todo-title">📝 今日待办</div>
            <div class="todo-list" id="todayTodoList"></div>

        <div class="card">
          <div class="todo-section">

              <input type="text" class="todo-input" id="todoInput" placeholder="添加明日待办..." autocomplete="off">
              <button class="todo-add-btn" id="addTodoBtn">+ 添加</button>
            </div>

        <div class="card">
          <div style="font-size:0.8rem; font-weight:700; margin-bottom:8px;">📌 备忘录</div>

</div>

<div id="globalTooltip" class="tooltip-simple"></div>
<div id="dateModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <span id="modalDateTitle">2025-01-01</span>
      <button id="closeModalBtn">✕</button>
    </div>
    <div id="modalClientList" class="client-modal-list"></div>
  </div>
</div>

<script>
  (function(){
    // 配置 - 修改为你的 Worker URL
    const API_BASE = 'https://your-worker.your-subdomain.workers.dev';
    const WECHAT_KEY = 'wechat_slim_v2';
    const INTENT_KEY = 'intent_slim_v2';
    const CLIENTS_KEY = 'clients_slim_v2';
    const MEMO_KEY = 'memo_slim_v2';
    const LAST_RESET_KEY = 'month_reset_slim_v2';
    const DARK_KEY = 'dark_slim_mode';
    const LOCK_KEY = 'page_locked_state';
    const TODAY_TODO_KEY = 'today_todo_v1';
    const TOMORROW_TODO_KEY = 'tomorrow_todo_v1';
    const DEFAULT_PIN = '8520';

    let syncTimer = null;
    let isSyncing = false;

    const getTodayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const getTomorrowStr = () => {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    };
    const getCurrentMonth = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    };
    const getCurrentTime = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    };
    const loadMap = (key) => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e) { return {}; } };
    const saveMap = (key, obj) => localStorage.setItem(key, JSON.stringify(obj));

    // 显示同步状态
    function showSyncStatus(text, type) {
      const el = document.getElementById('syncStatus');
      el.textContent = text;
      el.className = 'sync-status show ' + (type || '');
      clearTimeout(el._timeout);
      el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // 打包所有数据
    function packAllData() {
      return {
        wechat: loadMap(WECHAT_KEY),
        intent: loadMap(INTENT_KEY),
        clients: JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]'),
        memo: localStorage.getItem(MEMO_KEY) || '',
        todayTodo: JSON.parse(localStorage.getItem(TODAY_TODO_KEY) || '[]'),
        tomorrowTodo: JSON.parse(localStorage.getItem(TOMORROW_TODO_KEY) || '[]'),
        darkMode: localStorage.getItem(DARK_KEY) === 'true',
        lastReset: localStorage.getItem(LAST_RESET_KEY) || ''
      };
    }

    // 从服务器拉取数据
    async function fetchFromCloud() {
      try {
        const resp = await fetch(`${API_BASE}/api/data`);
        const json = await resp.json();
        if (json.success && json.data) {
          const d = json.data;
          saveMap(WECHAT_KEY, d.wechat || {});
          saveMap(INTENT_KEY, d.intent || {});
          localStorage.setItem(CLIENTS_KEY, JSON.stringify(d.clients || []));
          localStorage.setItem(MEMO_KEY, d.memo || '');
          localStorage.setItem(TODAY_TODO_KEY, JSON.stringify(d.todayTodo || []));
          localStorage.setItem(TOMORROW_TODO_KEY, JSON.stringify(d.tomorrowTodo || []));
          localStorage.setItem(DARK_KEY, d.darkMode ? 'true' : 'false');
          if (d.lastReset) localStorage.setItem(LAST_RESET_KEY, d.lastReset);
          return true;
        }
        return false;
      } catch (e) {
        console.error('拉取数据失败:', e);
        return false;
      }
    }

    // 上传数据到服务器
    async function uploadToCloud() {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const data = packAllData();
        const resp = await fetch(`${API_BASE}/api/data`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: DEFAULT_PIN, data })
        });
        const json = await resp.json();
        if (json.success) {
          showSyncStatus('☁️ 已同步', 'success');
          return true;
        } else {
          showSyncStatus('同步失败', 'error');
          return false;
        }
      } catch (e) {
        showSyncStatus('网络错误', 'error');
        return false;
      } finally {
        isSyncing = false;
      }
    }

    // 首次加载时从云端拉取数据
    async function initialLoad() {
      const synced = await fetchFromCloud();
      if (synced) {
        showSyncStatus('☁️ 已加载云端数据', 'success');
      }
    }
    
    function autoMonthlyReset() {
      const cur = getCurrentMonth();
      const last = localStorage.getItem(LAST_RESET_KEY);
      if(last !== cur) {
        localStorage.setItem(WECHAT_KEY, JSON.stringify({}));
        localStorage.setItem(INTENT_KEY, JSON.stringify({}));
        localStorage.setItem(LAST_RESET_KEY, cur);
      }
    }
    function getWeekTotal(map) {
      const today = new Date();
      const dow = today.getDay();
      const diffMon = (dow === 0 ? 6 : dow - 1);
      const monday = new Date(today);
      monday.setDate(today.getDate() - diffMon);
      const monStr = `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
      let sum = 0;
      for(let [date,val] of Object.entries(map)) if(date >= monStr && date <= getTodayStr()) sum += val;
      return sum;
    }
    function getMonthTotal(map) {
      const prefix = getTodayStr().slice(0,7);
      let sum = 0;
      for(let [date,val] of Object.entries(map)) if(date.startsWith(prefix)) sum += val;
      return sum;
    }

    function getClientsByDate(dateStr) {
      const clients = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]');
      return clients.filter(c => c.date === dateStr);
    }

    function showClientsForDate(dateStr) {
      const clients = getClientsByDate(dateStr);
      const modal = document.getElementById('dateModal');
      const modalTitle = document.getElementById('modalDateTitle');
      const modalList = document.getElementById('modalClientList');
      modalTitle.innerText = `${dateStr} 意向客户`;
      if(clients.length === 0) {
        modalList.innerHTML = `<div class="empty-clients">📭 当日无意向客户记录</div>`;
      } else {
        modalList.innerHTML = clients.map(c => `
          <div class="modal-client-item">
            <div><span class="modal-client-name">${escapeHtml(c.name)}</span><span class="modal-client-phone">${escapeHtml(c.phone)}</span></div>
            ${c.time ? `<div style="font-size:0.65rem; color:var(--text-light); margin-top:2px;">⏰ ${escapeHtml(c.time)}</div>` : ''}
            ${c.note ? `<div class="modal-client-note">📝 ${escapeHtml(c.note)}</div>` : ''}
          </div>
        `).join('');
      }
      modal.classList.add('active');
    }
    function closeModal() {
      document.getElementById('dateModal').classList.remove('active');
    }

    function renderCalendar(wechatMap, intentMap) {
      const todayDate = new Date();
      const year = todayDate.getFullYear();
      const month = todayDate.getMonth();
      const firstDay = new Date(year, month, 1);
      let startIdx = (firstDay.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const todayStr = getTodayStr();
      const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      document.getElementById('calMonthTitle').innerHTML = `${year}年 ${monthNames[month]}`;
      
      let grid = '';
      const weekDays = ['一','二','三','四','五','六','日'];
      weekDays.forEach(d => { grid += `<div class="cal-weekday">${d}</div>`; });
      for(let i=0; i<startIdx; i++) grid += `<div class="cal-day"></div>`;
      
      for(let d=1; d<=daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const wVal = wechatMap[dateStr] || 0;
        const iVal = intentMap[dateStr] || 0;
        let badgeHtml = '';
        if(wVal>0 || iVal>0) {
          badgeHtml = `<div class="day-badge">${wVal>0 ? `<span>📋${wVal}</span>` : ''}${iVal>0 ? `<span>🎯${iVal}</span>` : ''}</div>`;
        }
        const isToday = (dateStr === todayStr);
        grid += `<div class="cal-day ${isToday ? 'today' : ''}" data-date="${dateStr}" data-w="${wVal}" data-i="${iVal}">
                  <div class="day-number">${d}</div>
                  ${badgeHtml}
                </div>`;
      }
      document.getElementById('calGrid').innerHTML = grid;
      
      const tooltipDiv = document.getElementById('globalTooltip');
      const cells = document.querySelectorAll('.cal-day[data-date]');
      cells.forEach(cell => {
        cell.addEventListener('mouseenter', (e) => {
          const date = cell.dataset.date;
          const w = cell.dataset.w || 0;
          const i = cell.dataset.i || 0;
          tooltipDiv.innerHTML = `<strong>${date}</strong> 微信:${w} 意向:${i} | 点击查看客户`;
          tooltipDiv.classList.add('show');
        });
        cell.addEventListener('mouseleave', () => tooltipDiv.classList.remove('show'));
        cell.addEventListener('mousemove', (e) => {
          tooltipDiv.style.left = (e.clientX + 12) + 'px';
          tooltipDiv.style.top = (e.clientY - 28) + 'px';
        });
        cell.addEventListener('click', (e) => {
          e.stopPropagation();
          const date = cell.dataset.date;
          if(date) showClientsForDate(date);
        });
      });
    }

    function modifyCounter(key, delta) {
      const data = loadMap(key);
      const today = getTodayStr();
      let cur = data[today] || 0;
      let newVal = cur + delta;
      if(newVal < 0) newVal = 0;
      if(newVal === 0) delete data[today];
      else data[today] = newVal;
      saveMap(key, data);
      refreshAll();
      uploadToCloud();
    }
    function resetToday(key) {
      const data = loadMap(key);
      delete data[getTodayStr()];
      saveMap(key, data);
      refreshAll();
      uploadToCloud();
    }

    function renderClientList() {
      const clients = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]');
      const container = document.getElementById('clientList');
      container.innerHTML = clients.map((c, idx) => `
        <div class="client-row">
          <div class="client-info">
            <span class="client-name">${escapeHtml(c.name)}</span>
            <span class="client-phone">${escapeHtml(c.phone)}</span>
            ${c.note ? `<span class="client-note">📝 ${escapeHtml(c.note)}</span>` : ''}
            <span class="client-time">⏰ ${escapeHtml(c.time || '')}</span>
          </div>
          <button class="del-icon" data-idx="${idx}" title="删除">✕</button>
        </div>
      `).join('');
      document.querySelectorAll('.del-icon').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(btn.dataset.idx);
          const arr = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]');
          arr.splice(idx, 1);
          localStorage.setItem(CLIENTS_KEY, JSON.stringify(arr));
          renderClientList();
          refreshAll();
          uploadToCloud();
        });
      });
    }

    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function loadTodos(key) {
      try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; }
    }
    function saveTodos(key, arr) {
      localStorage.setItem(key, JSON.stringify(arr));
    }
    
    function renderTodos() {
      const todayTodos = loadTodos(TODAY_TODO_KEY);
      const tomorrowTodos = loadTodos(TOMORROW_TODO_KEY);
      
      const todayContainer = document.getElementById('todayTodoList');
      const tomorrowContainer = document.getElementById('tomorrowTodoList');
      
      if(todayTodos.length === 0) {
        todayContainer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-light); padding:6px;">暂无待办</div>';
      } else {
        todayContainer.innerHTML = todayTodos.map((t, i) => `
          <div class="todo-item">
            <span class="todo-number">${i+1}.</span>
            <span class="todo-text">${escapeHtml(t)}</span>
          </div>
        `).join('');
      }
      
      if(tomorrowTodos.length === 0) {
        tomorrowContainer.innerHTML = '<div style="font-size:0.75rem; color:var(--text-light); padding:6px;">暂无待办</div>';
      } else {
        tomorrowContainer.innerHTML = tomorrowTodos.map((t, i) => `
          <div class="todo-item">
            <span class="todo-number">${i+1}.</span>
            <span class="todo-text">${escapeHtml(t)}</span>
            <button class="todo-del-btn" data-idx="${i}" data-list="tomorrow">✕</button>
          </div>
        `).join('');
      }
      
      document.querySelectorAll('.todo-del-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(btn.dataset.idx);
          const list = btn.dataset.list;
          if(list === 'tomorrow') {
            const todos = loadTodos(TOMORROW_TODO_KEY);
            todos.splice(idx, 1);
            saveTodos(TOMORROW_TODO_KEY, todos);
            renderTodos();
            uploadToCloud();
          }
        });
      });
    }
    
    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if(!text) return;
      const todos = loadTodos(TOMORROW_TODO_KEY);
      todos.push(text);
      saveTodos(TOMORROW_TODO_KEY, todos);
      input.value = '';
      renderTodos();
      uploadToCloud();
    }

    function addClient() {
      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const note = document.getElementById('custNote').value.trim();
      if(!name || !phone) { alert('请填写姓名和电话'); return; }
      if(!note) { alert('沟通记录为必填项'); return; }
      const list = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]');
      const today = getTodayStr();
      const time = getCurrentTime();
      list.push({ name, phone, note, date: today, time: time });
      localStorage.setItem(CLIENTS_KEY, JSON.stringify(list));
      const intentData = loadMap(INTENT_KEY);
      const curIntent = intentData[today] || 0;
      intentData[today] = curIntent + 1;
      saveMap(INTENT_KEY, intentData);
      
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custNote').value = '';
      renderClientList();
      refreshAll();
      uploadToCloud();
    }

    function refreshAll() {
      autoMonthlyReset();
      const wechatMap = loadMap(WECHAT_KEY);
      const intentMap = loadMap(INTENT_KEY);
      const today = getTodayStr();
      const wechatToday = wechatMap[today] || 0;
      const intentToday = intentMap[today] || 0;
      
      document.getElementById('wechatNum').innerText = wechatToday;
      document.getElementById('intentNum').innerText = intentToday;
      document.getElementById('pinWechatNum').innerText = wechatToday;
      document.getElementById('pinIntentNum').innerText = intentToday;
      document.getElementById('weekWechat').innerText = getWeekTotal(wechatMap);
      document.getElementById('monthWechat').innerText = getMonthTotal(wechatMap);
      document.getElementById('weekIntent').innerText = getWeekTotal(intentMap);
      document.getElementById('monthIntent').innerText = getMonthTotal(intentMap);
      
      const now = new Date();
      const week = ['周日','周一','周二','周三','周四','周五','周六'];
      document.getElementById('liveDate').innerHTML = `${now.getMonth()+1}月${now.getDate()}日 ${week[now.getDay()]}`;
      renderCalendar(wechatMap, intentMap);
      renderClientList();
      renderTodos();
      const savedMemo = localStorage.getItem(MEMO_KEY) || '';
      document.getElementById('memoField').value = savedMemo;
    }

    function initDarkMode() {
      const isDark = localStorage.getItem(DARK_KEY) === 'true';
      if(isDark) document.body.classList.add('dark-mode');
      document.getElementById('darkToggleBtn').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem(DARK_KEY, document.body.classList.contains('dark-mode'));
        uploadToCloud();
      });
    }

    function isPageLocked() {
      return localStorage.getItem(LOCK_KEY) === 'true';
    }
    
    function setPageLocked(locked) {
      if(locked) {
        localStorage.setItem(LOCK_KEY, 'true');
        document.body.classList.add('page-hidden');
      } else {
        localStorage.setItem(LOCK_KEY, 'false');
        document.body.classList.remove('page-hidden');
      }
    }

    const pinInput = document.getElementById('pinInput');
    const pinUnlockBtn = document.getElementById('pinUnlockBtn');
    const pinError = document.getElementById('pinError');
    
    async function attemptUnlock() {
      const entered = pinInput.value.trim();
      if(entered === DEFAULT_PIN) {
        setPageLocked(false);
        pinInput.value = '';
        pinError.innerText = '';
        await initialLoad();
        refreshAll();
      } else {
        pinError.innerText = 'PIN码错误';
        pinInput.value = '';
      }
    }
    
    pinUnlockBtn.addEventListener('click', attemptUnlock);
    pinInput.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') attemptUnlock();
    });

    const hideBtn = document.getElementById('hideBtn');
    function lockPage() {
      setPageLocked(true);
      pinInput.value = '';
      pinError.innerText = '';
    }
    hideBtn.addEventListener('click', lockPage);

    window.addEventListener('keydown', (e) => {
      if(e.ctrlKey && e.key === 'z') {
        const active = document.activeElement;
        if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
        e.preventDefault();
        if(document.body.classList.contains('page-hidden')) {
          pinError.innerText = '请使用PIN解锁';
        } else {
          lockPage();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if(e.key === '+' || e.key === '=') { e.preventDefault(); modifyCounter(WECHAT_KEY, 1); }
      else if(e.key === '-' || e.key === '_') { e.preventDefault(); modifyCounter(WECHAT_KEY, -1); }
    });
    
    document.getElementById('wechatPlus').addEventListener('click', () => modifyCounter(WECHAT_KEY, 1));
    document.getElementById('wechatMinus').addEventListener('click', () => modifyCounter(WECHAT_KEY, -1));
    document.getElementById('resetWechatToday').addEventListener('click', () => resetToday(WECHAT_KEY));
    document.getElementById('intentPlus').addEventListener('click', () => modifyCounter(INTENT_KEY, 1));
    document.getElementById('intentMinus').addEventListener('click', () => modifyCounter(INTENT_KEY, -1));
    document.getElementById('resetIntentToday').addEventListener('click', () => resetToday(INTENT_KEY));
    document.getElementById('addClientBtn').addEventListener('click', addClient);
    document.getElementById('addTodoBtn').addEventListener('click', addTodo);
    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if(e.key === 'Enter') addTodo();
    });
    ['custName','custPhone','custNote'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => { if(e.key === 'Enter') addClient(); });
    });
    document.getElementById('memoField').addEventListener('input', (e) => {
      localStorage.setItem(MEMO_KEY, e.target.value);
      clearTimeout(window._memoSyncTimer);
      window._memoSyncTimer = setTimeout(() => uploadToCloud(), 1500);
    });
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('dateModal').addEventListener('click', (e) => { if(e.target === document.getElementById('dateModal')) closeModal(); });
    
    // 手动同步按钮
    document.getElementById('syncNowBtn').addEventListener('click', () => {
      showSyncStatus('同步中...', '');
      uploadToCloud();
    });
    
    initDarkMode();
    
    if(!isPageLocked()) {
      setPageLocked(false);
      initialLoad().then(() => refreshAll());
    } else {
      document.body.classList.add('page-hidden');
    }
    
    refreshAll();
    
    // 定时同步
    setInterval(() => {
      if(!document.body.classList.contains('page-hidden')) {
        refreshAll();
      }
    }, 60000);
    
    // 每30秒自动同步
    setInterval(() => {
      if(!document.body.classList.contains('page-hidden')) {
        uploadToCloud();
      }
    }, 30000);
  })();
</script>
</body>
</html>
