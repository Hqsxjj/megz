name: Android APK Auto-Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android Debug APK
      run: |
        cd megz-android
        # Initialize gradle wrapper using exactly version 8.2 to ensure full compatibility
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Compiled APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: 每日工作_拨号助手_Android_App
        path: megz-android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        name: "最新自动构建版本 (Latest Auto Build)"
        body: |
          每日工作 (Megz) CRM & 快捷拨号助手安卓最新自动编译测试包。
          由 GitHub Actions 自动构建部署，包含最新的性能优化与功能升级。
          
          **更新说明**：
          - 自动同步最新提交的代码
          - 一键在 App 内完成自动更新
          - 极简首开与隐藏式设置交互
        draft: false
        prerelease: false
        files: megz-android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
