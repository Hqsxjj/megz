name: Android APK Auto-Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android Debug APK
      run: |
        cd megz-android
        # Initialize gradle wrapper using exactly version 8.2 to ensure full compatibility
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Compiled APK to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: 每日工作_拨号助手_Android_App
        path: megz-android/app/build/outputs/apk/debug/app-debug.apk
